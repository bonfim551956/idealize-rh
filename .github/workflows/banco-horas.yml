# Robô do banco de horas: todo dia às 9h (Brasília) lê o banco de horas no VR (Pontomais)
# e envia para o Idealize RH 360º. Também pode ser rodado na mão em Actions → "Banco de horas (VR)" → Run workflow.
name: Banco de horas (VR)

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 09:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banco-horas
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: robos/banco-horas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: robos/banco-horas/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Ler o VR e enviar ao RH 360
        run: node index.mjs
        env:
          VR_USUARIO: ${{ secrets.VR_USUARIO }}
          VR_SENHA: ${{ secrets.VR_SENHA }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
          RH_ROBO_CHAVE: ${{ secrets.RH_ROBO_CHAVE }}
          RH_SUPABASE_URL: https://ifqaukdkurkirmahpuky.supabase.co
          RH_SUPABASE_CHAVE_PUBLICA: sb_publishable_K0XKMUMbZoWD1nP54G8tpA_b3fm5ZUr
